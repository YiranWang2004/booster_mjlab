seed: 42
num_steps_per_env: 24
max_iterations: 60000
obs_groups:
  actor: !!python/tuple
  - actor
  critic: !!python/tuple
  - critic
  amp: !!python/tuple
  - amp
save_interval: 50
experiment_name: k1_velocity_amp_symmetric_muon
run_name: ''
logger: tensorboard
wandb_project: mjlab
wandb_tags: !!python/tuple []
resume: false
load_run: .*
load_checkpoint: model_.*.pt
clip_actions: null
upload_model: true
class_name: AmpOnPolicyRunner
actor:
  hidden_dims: !!python/tuple
  - 512
  - 256
  - 128
  activation: elu
  obs_normalization: true
  cnn_cfg: null
  distribution_cfg:
    class_name: rsl_rl.modules.distribution:GaussianDistribution
    init_std: 1.0
  rnn_type: null
  rnn_hidden_dim: 256
  rnn_num_layers: 1
  class_name: MLPModel
critic:
  hidden_dims: !!python/tuple
  - 512
  - 256
  - 128
  activation: elu
  obs_normalization: true
  cnn_cfg: null
  distribution_cfg: null
  rnn_type: null
  rnn_hidden_dim: 256
  rnn_num_layers: 1
  class_name: MLPModel
algorithm:
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.001
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.01
  desired_kl: 0.01
  max_grad_norm: 1.0
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  optimizer: adam
  share_cnn_encoders: false
  class_name: booster_mjlab.amp.algorithms.amp_ppo:AmpPPO
  symmetry_cfg:
    use_data_augmentation: true
    use_mirror_loss: false
    data_augmentation_func: booster_mjlab.tasks.velocity.mdp.observations:augment_symmetries
    mirror_loss_coeff: 0.0
  muon_weight_decay: 0.0
  muon_momentum: 0.95
  muon_ns_steps: 5
  use_muon: true
dataset_root: whirlwind-ams/lafan_locomotion_k1
warm_start: false
discriminator:
  class_name: Discriminator
  hidden_layer_sizes: !!python/tuple
  - 256
  - 128
  reward_scale: 1.0
  reward_clamp_epsilon: 0.0001
  loss_type: bce
  loss_fn_kwargs: {}
  use_minibatch_std: true
  empirical_normalization: true
style_reward_weight: 0.3
amp_replay_buffer_size: 200000
amp_replay_insert_size: 1000
num_amp_obs_steps: 10
speed_factor: 1.0
dataset_weights: null
dataset_augmentations:
- name: mirror
- name: speed
  percent: 10.0
- name: speed
  percent: -10.0
- name: speed
  percent: 20.0
- name: speed
  percent: -20.0
dataset_transform: null
